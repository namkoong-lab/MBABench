[project]
name = "excel-agent"
version = "0.1.0"
description = "Automated Excel modeling agents for AI-powered spreadsheet tasks"
requires-python = ">=3.10"
dependencies = [
    # Core workflow dependencies
    "playwright>=1.54.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    # Web automation
    "patchright>=0.0.1",
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pathlib2>=2.3.7",
    # HTTP and web requests
    "httpx>=0.24.0",
    "requests>=2.31.0",
    # Cloud — used by infra/run.py + task_io for the DB-driven path
    # (BizbenchPostgresS3TaskSource / AttemptSink). The legacy
    # batch_automation_runner.py path does not need these.
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.0",
    # Development and testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

