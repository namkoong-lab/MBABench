project:
  name: "BizbenchJudge" # Used for logging and ENV vars prefixing.
keys:
  open_router_api_key: null
  database_url: null
  # Optional: For old DB connection during migration.
  old_database_url: null

  anthropic_key: null

  gemini_key: ""

paths:
  # For temporary storage during judging, e.g. for file extraction, intermediate files, etc.
  scratch_path: null

  # For excel recalculation before CSV extraction.
  libreoffice_path: null

miscs:
  logger_name: "bizbench_judge"
  log_to_terminal: true

judge:
  # Main judge version. Increment this when making significant changes to the judging process, e.g. changing the prompt template, rubric, or grading logic in a way that would greatly affect grading outcomes. This is used for tracking which grading results correspond to which judging configurations.
  version: 5

  # The prompt template to use for judging. Should be a YAML file in the judge/prompts directory.
  prompt_template: "prompts/judge_template_7_0.yaml"
  prompt_version: "7.0"

  # The rubric file containing subdimension and description
  rubric: "prompts/rubrics/rubric_8.json"
  rubric_version: "8"
  rubric_weight: "prompts/rubrics/rubric_6_weights.json"
  rubric_weight_version: "6"
  rubric_max_mistakes: 1

  do_rounding: true
  float_rounding: 6
  percentage_rounding: 8

  # Excel extract mode
  fast_cell_extract: true


  # Openrouter model to use for judging
  # openrouter_model: "google/gemini-2.5-flash-lite"
  # openrouter_model: "google/gemini-2.5-pro"
  openrouter_model: "google/gemini-3-flash-preview"

  check_order: "Accuracy,Formula,Formatting"

  # Context Limit
  default_total_character_limit: 2_000_000
  default_solution_context_char_limit: 1_000_000
  default_attempt_context_char_limit: 1_000_000

agentic_judge:
  version: 2
  prompt_template: "prompts/agentic_judge_template_4.yaml"
  prompt_version: "4"
  context_token_limit: 1000000
  max_rounds: 50
  read_file_max_cells: 5000

s3:
  # Destination for grading artifacts (contents of judge_results/) uploaded
  # after each grading. The final raw_files_path is:
  #   s3://{raw_files_bucket}/{raw_files_prefix}/{timestamp}_{uuid}/
  raw_files_bucket: "mbabench"
  raw_files_prefix: "BizbenchV1/grading"
# EOF
