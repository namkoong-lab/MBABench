# ChatGPT Web Agent — Template Configuration
# ===========================================
# This file defines AGENT settings shared across all tasks.
# Task-specific settings (files, output naming) go in your tasks YAML.
#
# See tasks_configs/examples/sample_tasks.yaml for task list format.

template:
  agent_type: "chatgpt_web"

  # Base directory for resolving relative paths in upload_files.
  # If omitted, paths are resolved from the current working directory.
  # local_files_base: "project_data/"

  # Benchmark prompt: the recovered pv9 text, byte-identical to what
  # claude_web and chatgpt_agent sent on the 206 in-scope tasks. Both
  # providers now share it so results are directly comparable.
  # See tasks_configs/prompts_pv9/README.md for provenance.
  prompts_file: "tasks_configs/prompts_pv9/SHARED_pv9_prompt.txt"
  prompt_version: 9

  # Where the downloaded .xlsx artifact is saved (relative to CWD).
  download_artifacts: true
  artifact_download_dir: "./artifacts"

  # ChatGPT Web Agent specific settings
  chatgpt_web:
    # REQUIRED: paste from your ChatGPT project URL.
    # Example URL: https://chatgpt.com/g/g-p-{project_id}-{slug}/project
    # See README §5 for full instructions. Both fields are required.
    project_id: "6a5fad57b1f88191805ca675dfaa6ba4"
    project_slug: null   # new ChatGPT project URLs have no slug

    # DEPRECATED: Agent mode no longer exists in the ChatGPT UI (removed
    # ~mid-2026). The key is accepted but ignored (warning at runtime).
    agent_mode: false

    # Model selection (optional). If null or omitted, uses the current
    # model in your ChatGPT session.
    # Options: gpt_5_6_sol, gpt_5_5, gpt_5_4, gpt_5_3, o3
    # (Legacy one-axis values instant/thinking/pro are auto-routed to the
    #  intelligence axis with a warning.)
    model: gpt_5_6_sol

    # Surface mode: "chat" (legacy behavior) or "work". The toggle's
    # selection persists across sessions, so the agent asserts it every
    # task in both directions. Work runs are the 2026-07 benchmark target.
    mode: work

    # WORK-mode picker (pill menu > Advanced). Work-mode models:
    # gpt_5_6_sol, gpt_5_6_terra, gpt_5_6_luna, gpt_5_5.
    # Effort: light, medium, high, xhigh, max, ultra. Speed: standard, fast.
    effort: ultra
    speed: standard

    # CHAT-mode intelligence axis (instant, medium, high, xhigh, pro).
    # Must be null when mode: work.
    intelligence: null

    max_sec_per_task: 5400  # 90 min timeout

    browser:
      type: "chrome"
      headless: false
      timeout: 30000
      cdp_port: 9226              # must match Chrome --remote-debugging-port

    check_interval_seconds: 3
    max_wait_per_prompt_seconds: 5400  # 90 min — single prompt does all 3 steps

    retry:
      max_agent_attempts: 3
      max_total_attempts: 10
      max_sec_per_attempt: 5400
      sleep_between_retries: 5

    output:
      folder_prefix: "chatgptGUI"

    session:
      agent_name: "chatgpt_web"

    logging:
      level: "INFO"
      save_to_file: true
      log_directory: "chatgpt_web_logs"

    runtime:
      no_hold: true
