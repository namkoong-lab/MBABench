# Smoke Test: Claude.ai web agent
# Sends trivial prompts to verify the full pipeline.
# Expected: SUCCESS on first attempt, Excel workbook downloaded.

template:
  agent_type: "claude_web"
  prompt_version: 2

  prompts:
    - "Create a new Excel workbook. Add a sheet called 'test_output' and write the word 'test' in cell A1."
    - "Add a sheet called 'model_smoke' and write 'smoke test passed' in cell A1."
    - "Add a sheet called 'answers_smoke' and write 'done' in cell A1. Then download the workbook as an .xlsx file."

  upload_to_cloud: false
  db_enabled: false

  claude_web:
    project_id: "019f85bc-934b-73dd-b90d-79e48e2089ee"
    # Benchmark target: Cowork mode, Fable 5 at Max effort (no thinking
    # switch exists for this combination), auto-approved actions.
    mode: cowork
    cowork_approval: auto
    model: fable_5
    effort: max

    max_sec_per_task: 900

    retry:
      max_agent_attempts: 1
      max_total_attempts: 2
      max_sec_per_task: 900
      max_sec_per_attempt: 900

    output:
      base_dir: "."
      folder_prefix: "smoke_claudeGUI"

    browser:
      type: "chrome"
      headless: false
      timeout: 30000
      cdp_port: 9223              # must match Chrome --remote-debugging-port

    check_interval_seconds: 2
    max_wait_per_prompt_seconds: 600   # max effort thinks longer, even on trivial prompts

    logging:
      level: "DEBUG"
      save_to_file: true
      log_directory: "claude_web_logs"

    runtime:
      no_hold: true
